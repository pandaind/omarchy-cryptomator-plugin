name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Package plugin archive
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          ARCHIVE_NAME="omarchy-cryptomator-plugin-${TAG_NAME}.tar.gz"
          tar --exclude='.git' \
              --exclude='.github' \
              --exclude='__pycache__' \
              --exclude='*.pyc' \
              -czf "${ARCHIVE_NAME}" .
          sha256sum "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"
          echo "ARCHIVE_NAME=${ARCHIVE_NAME}" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "${ARCHIVE_NAME}" \
            "${ARCHIVE_NAME}.sha256" \
            --title "Release ${GITHUB_REF_NAME}" \
            --generate-notes
